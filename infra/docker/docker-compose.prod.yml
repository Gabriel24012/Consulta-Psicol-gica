services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../../.env
    environment:
      TZ: ${APPOINTMENT_TIMEZONE:-America/Mexico_City}
      MATERIALS_UPLOAD_DIR: /app/uploads/materials
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - materials-uploads:/app/uploads
    depends_on:
      - redis
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else redis-server --appendonly yes; fi'
    restart: unless-stopped
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_HOST_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  redis-data:
  materials-uploads:
